name: mix-only

# Builds the soundtrack on its own, with no render, so a broken mix costs ~5 minutes instead
# of a 6-hour 2K render. This exists because the gate job builds the mix AFTER stitching a
# finished picture: if music.py throws, the failure arrives hours late and at full price.
#
# Trigger: Actions tab -> mix-only -> Run workflow.

on:
  workflow_dispatch:

jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip
          pip install --quiet numpy scipy || pip3 install --quiet --break-system-packages numpy scipy
          python3 -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"

      - name: build the mix
        run: |
          set -euo pipefail
          mkdir -p out
          cd src/videos/stink/audio
          python3 mix.py 2>&1 | tee "$GITHUB_WORKSPACE/out/mix.log"
          test -s mix.wav || { echo "::error::mix.py did not produce mix.wav"; exit 1; }

      - name: measure what came out
        run: |
          set -euo pipefail
          cd src/videos/stink/audio
          ffprobe -v error -show_entries format=duration -show_entries stream=sample_rate,channels,codec_name \
            -of default=noprint_wrappers=1 mix.wav | tee "$GITHUB_WORKSPACE/out/mix.ffprobe.txt"
          # the film is 62.5667 s; a mix that is 67.5 s is still the bridge timeline
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 mix.wav)
          python3 - "$D" <<'PY'
          import sys
          d = float(sys.argv[1])
          print(f"mix duration {d:.4f} s (want 62.5667)")
          assert abs(d - 62.5667) < 0.05, f"WRONG LENGTH: {d:.4f} s"
          PY
          # integrated loudness and true peak, from the file itself
          ffmpeg -hide_banner -nostats -i mix.wav -af ebur128=peak=true -f null - 2>&1 \
            | sed -n '/Summary:/,$p' | tee "$GITHUB_WORKSPACE/out/mix.ebur128.txt"

      - name: check the silence at the turn
        run: |
          set -euo pipefail
          cd src/videos/stink/audio
          # The dropout is the SCORE cutting out on "It was not.", not the film going quiet:
          # the narration carries straight through it. So measure stem_music.wav, never mix.wav —
          # a check on the mix fails on the voice, which is supposed to be there.
          #
          # volumedetect gives one clean "mean_volume: -57.8 dB" line. Expect roughly -58 dB
          # mean in the dropout against -32 dB either side (the hall's tail decays rather than
          # vanishing, which is what a hard cut into a 2.4 s reverb should sound like).
          vol() { ffmpeg -nostats -ss "$1" -t "$2" -i stem_music.wav -af volumedetect -f null - 2>&1 \
                  | sed -n 's/.*mean_volume: \(.*\) dB/\1/p'; }
          IN=$(vol 48.60 3.50); PRE=$(vol 47.0 1.3); POST=$(vol 52.4 2.2)
          {
            echo "music stem mean volume, dB:"
            echo "  before the cut (47.0-48.3): $PRE"
            echo "  in the dropout (48.6-52.1): $IN"
            echo "  after the return (52.4-54.6): $POST"
          } | tee "$GITHUB_WORKSPACE/out/silence.txt"
          python3 - "$IN" "$PRE" "$POST" <<'PY'
          import sys
          inr, pre, post = (float(x) for x in sys.argv[1:4])
          assert inr < pre - 15, f"score does not drop in the dropout: {inr:.1f} vs {pre:.1f} dB"
          assert inr < post - 15, f"score does not drop in the dropout: {inr:.1f} vs {post:.1f} dB"
          print(f"score drops {pre - inr:.0f} dB at the turn and returns {post - inr:.0f} dB after "
                f"— the cut on 'It was not.' holds")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mix-only
          path: |
            out/mix.log
            out/mix.ffprobe.txt
            out/mix.ebur128.txt
            out/silence.txt
            src/videos/stink/audio/cues.md
            src/videos/stink/audio/mix.wav
            src/videos/stink/audio/stem_voice.wav
            src/videos/stink/audio/stem_music.wav
            src/videos/stink/audio/stem_sfx.wav
          retention-days: 7
