name: render

# The real render. Runs only when you press Run workflow — nothing is automatic.
#
# Shape:
#   prep    -> typecheck, get chrome, probe that WebGL draws, plan the chunks
#   render  -> one parallel job per chunk (matrix)
#   stitch  -> concat the chunks losslessly, prove the frame count
#   gate    -> qa-gate.sh decides whether this is finished
#
# A chunk job that fails does not kill the others (fail-fast: false), and every chunk is
# uploaded as its own artifact so a single failed chunk can be re-run without redoing the
# whole film.

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "How many parallel chunks (2-16). More = faster, but each job pays ~2 min setup."
        required: false
        default: "6"
      gl:
        description: "GL backend. swangle = software (correct on a GPU-less runner)."
        required: false
        default: "swangle"
      scale:
        description: "Render scale. 4/3 = 1440x2560 FINAL. 0.4 = proxy."
        required: false
        default: "4/3"
      crf:
        description: "x264 quality. 16 = final, 24 = proxy."
        required: false
        default: "16"
      probe_only:
        description: "If true, stop after the WebGL probe (no render)."
        required: false
        default: "false"
      only_chunks:
        description: "Optional. Comma-separated chunk indices to render, e.g. '0,9,14'. Empty = all. The matrix is the same plan, so indices keep their frame ranges."
        required: false
        default: ""
      prior_run:
        description: "Optional run id(s) to take the chunks only_chunks did NOT render from. Comma-separated, tried in order, e.g. '42494165817' or '42524562270,42494165817'."
        required: false
        default: ""
      stitch_only:
        description: "If true, skip the render entirely and stitch from artifacts (needs prior_run). Use after a render that succeeded but failed at the stitch step."
        required: false
        default: "false"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

# The stitch job downloads another RUN's artifacts when prior_run is set, which the default
# token cannot do: artifacts are scoped to the run, and `gh run download <other-run>` needs
# actions:read. Declaring it here is the difference between a 2-hour recovery and a
# permission error at the last step.
permissions:
  contents: read
  actions: read

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 fonts-liberation || true
          sudo apt-get install -y -qq --no-install-recommends libasound2t64 || \
            sudo apt-get install -y -qq --no-install-recommends libasound2 || true
          ffmpeg -version | head -1

      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

      - name: get chrome
        run: node tools/ensure-browser.mjs

      - name: "PROBE: prove WebGL draws before rendering anything"
        env:
          GL: ${{ github.event.inputs.gl }}
          REMOTION_TMP: ${{ github.workspace }}/.rtmp
          COMP: MyShort
          ENTRY: src/index.ts
        run: |
          node tools/probe.mjs 30 300 900 1500 2>&1 | tee out/probe.txt
          grep -q "RESULT: WebGL draws here" out/probe.txt || {
            echo "::error::WebGL does not draw on this runner with GL=${{ github.event.inputs.gl }}. Not starting the render."
            exit 1
          }

      - name: plan chunks
        id: plan
        env:
          ONLY: ${{ github.event.inputs.only_chunks }}
        run: |
          N="${{ github.event.inputs.chunks }}"
          TOTAL=$(node -e "const s=require('fs').readFileSync('src/videos/stink/story.ts','utf8');const m=s.match(/export const TOTAL = (\d+)/);console.log(m?m[1]:'')")
          [ -n "$TOTAL" ] || { echo "::error::could not read TOTAL from story.ts"; exit 1; }
          echo "total frames: $TOTAL"
          echo "chunks: $N"
          MAP=$(bash tools/plan-chunks.sh "$TOTAL" "$N" | node -e '
            const lines=require("fs").readFileSync(0,"utf8").trim().split("\n").filter(Boolean);
            let inc=lines.map(l=>{const[i,a,b]=l.split(/\s+/).map(Number);return{i,a,b};});
            // only_chunks: re-render a subset without changing the plan. The index still
            // maps to the same frame range, so a subset chunk stitches with the others.
            const only=(process.env.ONLY||"").split(",").map(s=>s.trim()).filter(Boolean).map(Number);
            if(only.length){
              inc=inc.filter(c=>only.includes(c.i));
              if(inc.length!==only.length){console.error("::error::only_chunks names an index outside the plan");process.exit(1);}
            }
            console.log(JSON.stringify({include:inc}));
          ')
          echo "matrix=$MAP" >> "$GITHUB_OUTPUT"
          echo "chunks=$N" >> "$GITHUB_OUTPUT"
          echo "only_chunks: ${ONLY:-<all>}"
          echo "$MAP" | head -c 500

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            out/probe.txt
            out/probe/*.png
          retention-days: 7

  render:
    needs: prep
    # stitch_only: the chunks already exist as artifacts, so rendering them again would
    # spend hours to produce the same bytes. Skip straight to the stitch.
    if: github.event.inputs.probe_only != 'true' && github.event.inputs.stitch_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 fonts-liberation || true
          sudo apt-get install -y -qq --no-install-recommends libasound2t64 || \
            sudo apt-get install -y -qq --no-install-recommends libasound2 || true

      - run: npm ci --no-audit --no-fund
      - run: node tools/ensure-browser.mjs

      - name: "render chunk ${{ matrix.i }}: frames ${{ matrix.a }}-${{ matrix.b }}"
        env:
          GL: ${{ github.event.inputs.gl }}
          REMOTION_TMP: ${{ github.workspace }}/.rtmp
          COMP: MyShort
          ENTRY: src/index.ts
          LOG: out/chunk_${{ matrix.i }}.log
        run: |
          mkdir -p out/chunks
          bash tools/render-chunk.sh "out/chunks/chunk_${{ matrix.i }}.mp4" \
            ${{ matrix.a }} ${{ matrix.b }} \
            "${{ github.event.inputs.scale }}" \
            "${{ github.event.inputs.crf }}" 1 \
            2>&1 | tee "out/chunk_${{ matrix.i }}.txt"

      - name: "chunk ${{ matrix.i }} sanity (frames + pixels)"
        run: |
          F=out/chunks/chunk_${{ matrix.i }}.mp4
          N=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$F")
          WANT=$(( ${{ matrix.b }} - ${{ matrix.a }} + 1 ))
          echo "chunk ${{ matrix.i }}: $N frames (want $WANT)"
          [ "$N" = "$WANT" ] || { echo "::error::chunk ${{ matrix.i }} has $N frames, expected $WANT"; exit 1; }
          # a blank chunk renders fine and has the right frame count — check the pixels
          ffmpeg -v error -i "$F" -vf "signalstats,metadata=print:file=-" -f null - 2>&1 \
            | grep -o "YHIGH=[0-9.]*" | head -3 || true
          SPREAD=$(ffmpeg -hide_banner -i "$F" -vf "signalstats,metadata=print" -f null - 2>&1 \
            | awk -F= '/YLOW/{lo+=$2;n++} /YHIGH/{hi+=$2} END{if(n)printf "%d", (hi/n)-(lo/n); else print 0}')
          echo "mean tonal spread: $SPREAD"
          [ "$SPREAD" -gt 20 ] || { echo "::error::chunk ${{ matrix.i }} looks blank (spread $SPREAD)"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunk-${{ matrix.i }}
          path: |
            out/chunks/chunk_${{ matrix.i }}.mp4
            out/chunk_${{ matrix.i }}.log
            out/chunk_${{ matrix.i }}.txt
          retention-days: 7

  stitch:
    needs: [prep, render]
    # always(): a chunk failing must not silently skip the stitch — otherwise a 2-hour run
    # ends with no diagnostic at all. The stitch proves completeness itself below, so a
    # missing chunk still fails loudly, just with a useful message.
    if: always() && github.event.inputs.probe_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/download-artifact@v4
        # stitch_only renders nothing, so this run has no chunk artifacts of its own and the
        # step would fail on "no artifacts found". Skipping is safe: the prior-run pull below
        # is what supplies every chunk in that mode.
        if: github.event.inputs.stitch_only != 'true'
        with:
          pattern: chunk-*
          path: dl

      # A subset re-render (only_chunks) produces only the chunks it was asked for. The rest
      # of the film already exists as artifacts on an earlier run, and because the fix
      # removed only a non-rendering prop, those frames are pixel-identical. Pull them into
      # the SAME dl/ tree; the stitch below sorts by index and cannot tell them apart.
      #
      # prior_run accepts a COMMA-SEPARATED list, tried in order per missing chunk: a partial
      # re-render means the chunks you need are spread over more than one run.
      - name: pull the untouched chunks from the prior run(s)
        if: github.event.inputs.prior_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNS: ${{ github.event.inputs.prior_run }}
        run: |
          set -euo pipefail
          mkdir -p dl
          # Space-separated, NOT newline-separated: `case " $HAVE " in *" $i "*)` can only
          # match a space-delimited list. Newlines here silently re-download every chunk
          # into a directory that already holds its files, and the zip extract fails with
          # "file exists" — which is exactly how the first attempt at this step died.
          have() { ls -d dl/chunk-* 2>/dev/null | sed 's#.*/chunk-##' | sort -n | tr '\n' ' ' || true; }
          HAVE=$(have)
          echo "this run produced: ${HAVE:-<none>}"
          for RUN in $(echo "$RUNS" | tr ',' ' '); do
            [ -n "$RUN" ] || continue
            echo "== prior run $RUN"
            WANT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" \
                     --paginate -q '.artifacts[].name' | sed -n 's/^chunk-//p' | sort -n)
            [ -n "$WANT" ] || { echo "::warning::run $RUN has no chunk-* artifacts"; continue; }
            for i in $WANT; do
              case " $HAVE " in *" $i "*) continue;; esac
              rm -rf "dl/chunk-$i"
              if ! gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "chunk-$i" -D "dl/chunk-$i"; then
                echo "  chunk-$i: download failed on run $RUN — will try another run"
                rm -rf "dl/chunk-$i"; continue
              fi
              # An artifact can EXIST but be empty: a chunk that died still uploads its log.
              # Accept it only if the mp4 is really there, or a later run would be skipped.
              if find "dl/chunk-$i" -name "chunk_$i.mp4" -type f | grep -q .; then
                echo "  chunk-$i: pulled from $RUN"
                HAVE=$(have)
              else
                echo "  chunk-$i: run $RUN has no mp4 (empty artifact) — trying another run"
                rm -rf "dl/chunk-$i"
              fi
            done
          done
          echo "after pull: $(have)"

      - name: stitch
        run: |
          ls -R dl | head -40
          mkdir -p out
          # Order by the numeric index, not by string: "chunk-10" sorts before "chunk-2"
          # under a plain sort, which would silently splice the film out of order.
          #
          # Find each mp4 rather than assuming its depth. download-artifact preserves the
          # upload's path RELATIVE TO THE SHORTEST COMMON ROOT: uploading out/chunks/x.mp4
          # alongside out/x.log makes the common root `out/`, so the file lands at
          # dl/chunk-N/chunks/chunk_N.mp4 — NOT dl/chunk-N/chunk_N.mp4. The first render
          # that ever reached this job would have failed on a missing-file error.
          CHUNKS=$(ls -d dl/chunk-* | sed 's#.*/chunk-##' | sort -n | while read i; do
            f=$(find "dl/chunk-$i" -name "chunk_$i.mp4" -type f | head -1)
            [ -n "$f" ] || { echo "::error::chunk-$i artifact has no chunk_$i.mp4"; exit 1; }
            echo "$f"
          done)
          echo "chunks in order:"; echo "$CHUNKS"
          [ -n "$CHUNKS" ] || { echo "::error::no chunk artifacts downloaded"; exit 1; }
          # Prove the set is COMPLETE before joining. stitch.sh only checks that the chunks
          # it was given join cleanly — it cannot know one is missing from the middle, and a
          # film with a hole is exactly the silent failure this pipeline exists to prevent.
          NPLAN=${{ needs.prep.outputs.chunks }}
          # prep can fail (typecheck, WebGL probe), in which case there is no plan and no
          # chunks worth joining. Say so plainly instead of doing arithmetic on an empty var.
          [ -n "$NPLAN" ] || { echo "::error::no chunk plan from prep — nothing to stitch"; exit 1; }
          NGOT=$(echo "$CHUNKS" | grep -c . || true)
          echo "chunks present: $NGOT / $NPLAN"
          if [ "$NGOT" != "$NPLAN" ]; then
            MISSING=$(seq 0 $((NPLAN - 1)) | while read i; do
              ls -d "dl/chunk-$i" >/dev/null 2>&1 || printf "%s " "$i"; done)
            echo "::error::only $NGOT of $NPLAN chunks are present (missing: $MISSING) — refusing to stitch a film with holes. Re-run the missing chunks with only_chunks."
            exit 1
          fi
          bash tools/stitch.sh out/video_silent.mp4 $CHUNKS

      - name: concat the render logs
        run: |
          mkdir -p out
          : > out/render.log
          for i in $(ls -d dl/chunk-* | sed 's#.*/chunk-##' | sort -n); do
            # same nesting caveat as the stitch step: locate the log, don't assume its depth
            L=$(find "dl/chunk-$i" -name "chunk_$i.log" -type f | head -1)
            [ -n "$L" ] && cat "$L" >> out/render.log
          done
          wc -l out/render.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: silent-video
          path: out/video_silent.mp4
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-log
          path: out/render.log
          retention-days: 7

  gate:
    needs: [stitch]
    # NOT the implicit success(): that evaluates the whole ancestor chain, so a job whose
    # `render` was skipped (stitch_only) reads as unsuccessful and the gate never runs —
    # which is exactly what happened on the first stitch-only run. Judge the one job that
    # matters: did the stitch actually produce a film?
    if: "!cancelled() && needs.stitch.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: silent-video
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: render-log
          path: out
          continue-on-error: true

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip
          pip install --quiet numpy scipy pillow || pip3 install --quiet --break-system-packages numpy scipy pillow

      # The mix is BUILT here, not looked for. The old step only muxed a public/mix.wav that
      # nothing ever produced, so every render gated a silent video and the audio checks in
      # qa-gate could never pass. mix.py synthesizes the score and the sound design from the
      # same timeline.py the picture uses, then masters to -15 LUFS / -1.2 dBTP.
      - name: build the mix (voice + score + sound design)
        run: |
          # pipefail: without it a crashing mix.py is masked by tee succeeding, and the job
          # would carry on to mux a stale or absent wav.
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$GITHUB_WORKSPACE/src/videos/stink/audio"
          python3 mix.py 2>&1 | tee "$GITHUB_WORKSPACE/out/mix.log"
          test -s mix.wav || { echo "::error::mix.py did not produce mix.wav"; exit 1; }
          ffprobe -v error -show_entries format=duration -show_entries stream=sample_rate,channels \
            -of default=noprint_wrappers=1 mix.wav

      - name: mux audio onto the silent video
        run: |
          bash tools/mux.sh out/video_silent.mp4 src/videos/stink/audio/mix.wav out/video.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mix
          path: |
            src/videos/stink/audio/mix.wav
            src/videos/stink/audio/cues.md
            out/mix.log
          retention-days: 14

      - name: "THE GATE — qa-gate decides if this is finished"
        run: |
          bash tools/qa-gate.sh out/video.mp4 out/render.log shots.json 2>&1 | tee out/gate.txt
          echo "gate exit: ${PIPESTATUS[0]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final
          path: |
            out/video.mp4
            out/gate.txt
          retention-days: 14
